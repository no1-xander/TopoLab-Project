[project]
name = "topolab"
version = "0.6.0"
description = "An interactive laboratory for introductory topology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7.0", "matplotlib>=3.10,<4.0"]

[tool.pyside6-project]
files = [
    "main.py",
    "topolab/app.py",
    "topolab/services/math_renderer.py",
    "topolab/services/set_controller.py",
    "topolab/services/metric_controller.py",
    "topolab/services/exercise_controller.py",
    "topolab/services/draft_store.py",
    "topolab/data/exercise_bank.py",
    "topolab/data/quiz_bank.py",
    "topolab/core/example_validation.py",
    "qml/Main.qml",
    "qml/theme/Palette.js",
    "qml/components/MathFormula.qml",
]
